name: scrub-scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    # The laptop runners; a fork's pull request stays on GitHub's own machines, so outside code never runs on the laptop.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted","linux","wsl"]') }}
    steps:
      - uses: actions/checkout@v4
      - run: tools/scrub-scan.sh
        env:
          LC_ALL: C.UTF-8
